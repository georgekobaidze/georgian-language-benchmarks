- id: cloze-000
  title: კომპიუტერის ისტორია
  text: |
    კომპიუტერის ისტორია ბევრად ძველია, ვიდრე ერთი შეხედვით ჩანს. ჯერ კიდევ ძველ [1] ადამიანები გამოთვლებისთვის სხვადასხვა [2] [3]. ერთ-ერთი ყველაზე ცნობილი მათგანი აბაკია, რომელიც ათასობით წლის წინ [4].

    მეცხრამეტე [5] ინგლისელმა [6] ჩარლზ ბებიჯმა ანალიზური მანქანის პროექტი [7]. ეს მანქანა თანამედროვე კომპიუტერის [8] ითვლება, თუმცა ბებიჯმა მისი აწყობა ვერ [9]. მასთან ერთად მუშაობდა ადა ლავლეისი, რომელსაც ხშირად პირველ [10] უწოდებენ.

    მეორე მსოფლიო ომის დროს კომპიუტერების [11] მკვეთრად დაჩქარდა. ბრიტანელი მეცნიერი ალან ტიურინგი გერმანული დაშიფრული [12] გაშიფვრაზე მუშაობდა. 1946 წელს ამერიკაში ენიაკი [13], რომელიც თითქმის ოცდაათ ტონას [14].

    ორმოცდაათიან [15] გამოგონებულმა ტრანზისტორმა კომპიუტერების ზომა მნიშვნელოვნად [16]. სამოცდაათიან წლებში კი პირველი პერსონალური კომპიუტერები [17]. სტივ ჯობსმა და სტივ ვოზნიაკმა ავტოფარეხში Apple-ის პირველი [18] [19].

    ოთხმოცდაათიან წლებში ინტერნეტის [20] ადამიანების ცხოვრება მთლიანად [21]. დღეს კომპიუტერი თითქმის ყველა [22] არის, ჩვენს ჯიბეში არსებული [23] კი გაცილებით ძლიერია, ვიდრე ის კომპიუტერები, რომელთა დახმარებითაც ადამიანი პირველად მთვარეზე [24]. მეცნიერები ფიქრობენ, რომ მომავალში კვანტური კომპიუტერები ბევრ ისეთ [25] გადაჭრიან, რომელიც დღეს შეუძლებლად ითვლება.
