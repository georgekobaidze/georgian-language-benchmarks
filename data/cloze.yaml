- id: cloze-001
  title: რომის იმპერია
  text: |
    რომის [1] ისტორია, ლეგენდის თანახმად, ძვ. წ. 753 წელს იწყება, როდესაც ძმებმა რომულუსმა და რემუსმა ტიბრის ნაპირზე ქალაქი [2]. თავდაპირველად რომს [3] მართავდნენ, შემდეგ კი იქ რესპუბლიკა [4].

    რესპუბლიკის პერიოდში რომაელებმა ხმელთაშუა ზღვის თითქმის მთელი [5] დაიპყრეს. მათი ძალა ძლიერ და კარგად ორგანიზებულ [6] ეყრდნობოდა. ძვ. წ. პირველ საუკუნეში ცნობილმა [7] იულიუს კეისარმა გალია დაიპყრო, თუმცა ძვ. წ. 44 წელს სენატორებმა ის [8].

    კეისრის [9] შემდეგ ოქტავიანე ავგუსტუსი რომის პირველი [10] გახდა. მისი მმართველობით დაიწყო ორასწლიანი [11] პერიოდი, რომელსაც „რომაულ მშვიდობას“ უწოდებენ. ამ დროს რომაელები გზებს, ხიდებსა და აკვედუკებს [12], რომელთაგან ზოგიერთი დღემდეა [13].

    მეოთხე საუკუნეში იმპერატორმა კონსტანტინემ დედაქალაქი ბიზანტიონში [14] და მას კონსტანტინოპოლი [15]. 395 წელს იმპერია ორ [16] გაიყო: დასავლეთ და აღმოსავლეთ [17].

    დასავლეთ რომის იმპერია 476 წელს [18], როდესაც გერმანელმა [19] ოდოაკრმა უკანასკნელი იმპერატორი ტახტიდან [20]. აღმოსავლეთის იმპერია კი, რომელსაც დღეს ბიზანტიას ვუწოდებთ, თითქმის ათასი წლის განმავლობაში [21]. რომაულმა სამართალმა, ლათინურმა [22] და არქიტექტურამ ევროპის კულტურაზე უდიდესი [23] [24]. ბევრი თანამედროვე ენა, მათ შორის ფრანგული, იტალიური და ესპანური, სწორედ ლათინურიდან [25].
